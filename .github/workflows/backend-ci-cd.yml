name: Build and Push Backend Images

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "flight-service/**"
      - "shared/**"
      - ".github/workflows/backend-ci-cd.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            context: ./server
            dockerfile: ./server/Dockerfile.prod
            hook_secret: RENDER_DEPLOY_HOOK_SERVER
          - service: flight-service
            context: ./flight-service
            dockerfile: ./flight-service/Dockerfile.prod
            hook_secret: RENDER_DEPLOY_HOOK_FLIGHT_SERVICE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Trigger Render deploy
        run: |
          HOOK="${{ secrets[matrix.hook_secret] }}"
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            echo "Deploy hook za ${{ matrix.service }} nije setovan - preskačem."
          fi

